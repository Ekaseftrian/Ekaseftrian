<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title description">
  <title id="title">Eka Seftrian Anugera terminal profile banner</title>
  <desc id="description">A dark terminal window introducing Eka as a cybersecurity enthusiast and developer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="280" rx="22" fill="#06080d"/>
  <rect x="18" y="18" width="864" height="244" rx="14" fill="url(#background)" stroke="#30363d" filter="url(#shadow)"/>
  <path d="M18 62h864" stroke="#30363d"/>

  <circle cx="44" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="45" fill="#8b949e" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13">root@ekasa: ~</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="18">
    <text x="45" y="100" fill="#39d353">root@ekasa</text>
    <text x="164" y="100" fill="#c9d1d9">:</text>
    <text x="175" y="100" fill="#58a6ff">~</text>
    <text x="188" y="100" fill="#c9d1d9">$ whoami</text>

    <text x="45" y="137" fill="#f0f6fc" font-size="24" font-weight="700">Eka Seftrian Anugera</text>

    <text x="45" y="176" fill="#39d353">root@ekasa</text>
    <text x="164" y="176" fill="#c9d1d9">:</text>
    <text x="175" y="176" fill="#58a6ff">~</text>
    <text x="188" y="176" fill="#c9d1d9">$ cat focus.txt</text>

    <text x="45" y="215" fill="#a5d6ff">Web Security</text>
    <text x="183" y="215" fill="#8b949e">|</text>
    <text x="204" y="215" fill="#a5d6ff">Penetration Testing</text>
    <text x="421" y="215" fill="#8b949e">|</text>
    <text x="442" y="215" fill="#a5d6ff">IoT</text>
    <text x="488" y="215" fill="#8b949e">|</text>
    <text x="509" y="215" fill="#a5d6ff">Secure Development</text>
    <rect x="716" y="199" width="10" height="20" rx="1" fill="#39d353"/>
  </g>
</svg>
